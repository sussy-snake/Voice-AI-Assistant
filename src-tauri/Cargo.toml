[package]
name = "local-voice-assisted-llm"
version = "0.1.0"
description = "Lightweight Cross-Platform Local-First Voice AI Assistant"
authors = ["AI System Architect"]
edition = "2021"

[lib]
name = "local_voice_assisted_llm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-global-shortcut = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2.5"
ignore = "0.4"
sysinfo = "0.30"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json"] }
rayon = "1.10"
urlencoding = "2.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
